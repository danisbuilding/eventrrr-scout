name: pages
# Deploys site/ to GitHub Pages (scout.eventrrr.com) on every push to main that touches it.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Point the site at Scout IQ when the cutover flag is on
        if: ${{ vars.SCOUT_IQ_LIVE == 'true' }}
        env:
          URL: "${{ secrets.SCOUT_SUPABASE_URL }}"
          KEY: "${{ secrets.SCOUT_SUPABASE_ANON_KEY }}"
        run: |
          test -n "$URL" -a -n "$KEY" || { echo "SCOUT_IQ_LIVE is true but SCOUT_SUPABASE_URL / SCOUT_SUPABASE_ANON_KEY are missing"; exit 1; }
          cat > site/config.js <<EOF
          // Generated by pages.yml (SCOUT_IQ_LIVE=true): Scout IQ project. The publishable key is public by design; RLS protects.
          window.SCOUT_CONFIG = {
            supabaseUrl: "$URL",
            supabaseAnonKey: "$KEY",
            schema: "iq",
            eventsBase: "https://raw.githubusercontent.com/danisbuilding/eventrrr-scout/main",
          };
          EOF
          echo "config.js → Scout IQ ($URL)"
      - name: Stamp asset URLs so browsers fetch new code after each deploy
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|config\.js|categories\.js|app\.js)\"#\1=\"\2?v=$v\"#g" site/index.html
          grep -c "?v=$v" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
