<title>Eventrrr Scout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column of event rows under a sticky tab strip; Eventrrr's stone + orange palette. */
:root {
  --bg: #faf6f0; --surface: #ffffff; --ink: #1c1917; --muted: #78716c; --line: #e7e5e4;
  --accent: #c2410c; --accent-soft: #fff7f2; --accent-line: #f6cdb4;
  --keep: #047857; --keep-soft: #ecfdf5; --skip: #78716c; --skip-soft: #f5f5f4;
  --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171412; --surface: #211d1a; --ink: #f3efe9; --muted: #a39d95; --line: #35302b;
  --accent: #f0703a; --accent-soft: #2d1f17; --accent-line: #5a3524;
  --keep: #34d399; --keep-soft: #0f2a21; --skip: #a39d95; --skip-soft: #2a2622; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #171412; --surface: #211d1a; --ink: #f3efe9; --muted: #a39d95; --line: #35302b;
  --accent: #f0703a; --accent-soft: #2d1f17; --accent-line: #5a3524;
  --keep: #34d399; --keep-soft: #0f2a21; --skip: #a39d95; --skip-soft: #2a2622; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 860px; margin: 0 auto; }
header { padding-block: 22px 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h1 .rrr { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px 10px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 500 13px var(--body); cursor: pointer; white-space: nowrap; }
.tab .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab[aria-selected="true"] .n { color: #fde4d4; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 12px 4px; font-size: 13px; color: var(--muted); }
.tools label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tools input[type="search"] { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 10px; font: inherit; }
.tools .right { margin-left: auto; display: flex; gap: 8px; }
.day { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); padding-block: 18px 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); background: var(--bg); z-index: 4; }
.ev { display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.ev.hi { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); margin-inline: -8px; padding-inline: 8px; border-radius: 10px; }
.ev.decided-skip { opacity: .45; }
.time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 2px; }
.title { font-family: var(--display); font-weight: 600; font-size: 16px; margin: 0; text-wrap: balance; }
.title a { color: inherit; text-decoration: none; }
.title a:hover { text-decoration: underline; }
.sub { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.cat { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.chip.score { font-variant-numeric: tabular-nums; }
.chip.fam { border-style: dashed; }
.why { font-size: 13px; color: var(--ink); margin-top: 4px; }
.why::before { content: "★ "; color: var(--accent); }
.desc { font-size: 13px; margin-top: 2px; }
.act { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
button.b { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 11px; font: 500 13px var(--body); cursor: pointer; }
button.b:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.b.keep.on { background: var(--keep-soft); border-color: var(--keep); color: var(--keep); }
button.b.skip.on { background: var(--skip-soft); border-color: var(--skip); color: var(--skip); }
.act input { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 9px; font: 13px var(--body); }
.empty { color: var(--muted); padding-block: 40px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.status { font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .ev { grid-template-columns: 1fr; } .time { font-size: 12px; } .act { grid-column: 1; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Event<span class="rrr">rrr</span> Scout</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search title, venue, neighborhood" aria-label="Search">
    <label><input type="checkbox" id="fam"> Family-friendly only</label>
    <label><input type="checkbox" id="hideskip" checked> Hide skipped</label>
    <div class="right"><button class="b" id="export">Copy decisions JSON</button><span class="status" id="status"></span></div>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const META = __META__;
const EVENTS = __EVENTS__;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = (iso, allDay) => { if (allDay) return "All day"; const d = new Date(iso); if (isNaN(d)) return ""; return d.toLocaleTimeString("en-US", {hour: "numeric", minute: "2-digit", timeZone: "America/Mexico_City"}).replace(":00", ""); };
const fmtDay = (iso) => { const d = new Date(iso); if (isNaN(d)) return "Date unknown"; return d.toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric", timeZone: "America/Mexico_City"}); };
const price = (e) => e.price_text || (e.price_min === 0 ? "Free" : "");

// ---- decisions: db doc "decisions/<run>" when available, localStorage mirror otherwise
let decisions = {};
let db = null, docRef = null, canWrite = false;
const LS_KEY = "scout-decisions-" + META.run;
try { decisions = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch {}

function setStatus(t) { $("#status").textContent = t; }
let toastT; function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1600); }

let writing = Promise.resolve();
function saveDecision(key, patch) {
  decisions[key] = Object.assign({}, decisions[key] || {}, patch, {at: new Date().toISOString()});
  try { localStorage.setItem(LS_KEY, JSON.stringify(decisions)); } catch {}
  if (docRef && canWrite) {
    writing = writing.then(() => docRef.set({run: META.run, decisions})).then(() => setStatus("Saved"), (e) => { setStatus("Saved locally only"); if (e && e.code === "invalid_argument") canWrite = false; });
  } else setStatus("Saved locally");
}

(async () => {
  const w = window.claude; if (!w || !w.use) return;
  db = await w.use("db"); if (!db) return;
  const user = await w.use("user");
  canWrite = user ? (await user.can("data.write")) !== false : true;
  docRef = db.doc("decisions/" + META.run);
  docRef.onSnapshot((snap) => {
    if (snap.exists && snap.data().decisions) { decisions = Object.assign({}, decisions, snap.data().decisions); try { localStorage.setItem(LS_KEY, JSON.stringify(decisions)); } catch {} render(); }
    setStatus(canWrite ? "Synced" : "Read-only");
  }, () => setStatus("Saved locally"));
})();

// ---- tabs
let tab = "Highlights";
try { tab = location.hash.slice(1).replace(/-/g, " ") || "Highlights"; } catch {}
function tabs() {
  const counts = {Highlights: EVENTS.filter((e) => e.highlight).length, All: EVENTS.length};
  META.categories.forEach((c) => counts[c] = EVENTS.filter((e) => e.category === c).length);
  const names = ["Highlights", ...META.categories.filter((c) => counts[c]), "All"];
  if (!names.includes(tab)) tab = "Highlights";
  $("#tabs").innerHTML = names.map((n) => `<button class="tab" role="tab" aria-selected="${n === tab}" data-t="${esc(n)}">${esc(n)}<span class="n">${counts[n]}</span></button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach((b) => b.onclick = () => { tab = b.dataset.t; try { location.hash = tab.replace(/\s+/g, "-"); } catch {} tabs(); render(); });
}

// ---- list
function visible() {
  const q = $("#q").value.trim().toLowerCase();
  return EVENTS.filter((e) => {
    if (tab === "Highlights" && !e.highlight) return false;
    if (tab !== "Highlights" && tab !== "All" && e.category !== tab) return false;
    if ($("#fam").checked && !e.family_friendly) return false;
    if ($("#hideskip").checked && decisions[e.key]?.decision === "skip") return false;
    if (q && !`${e.title} ${e.venue} ${e.neighborhood} ${e.organizer}`.toLowerCase().includes(q)) return false;
    return true;
  });
}
function card(e) {
  const d = decisions[e.key] || {};
  const link = e.url || "";
  const sub = [e.venue, e.neighborhood, price(e)].filter(Boolean).join(" · ");
  return `<article class="ev ${e.highlight ? "hi" : ""} ${d.decision === "skip" ? "decided-skip" : ""}" data-k="${esc(e.key)}">
    <div class="time">${fmtTime(e.starts_at, e.all_day)}</div>
    <div>
      <h2 class="title">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}</h2>
      <div class="sub">${esc(sub)}</div>
      ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
      ${e.highlight_why ? `<div class="why">${esc(e.highlight_why)}</div>` : ""}
      <div class="chips">
        <span class="chip cat">${esc(e.category)}</span>
        ${e.family_friendly ? `<span class="chip fam">Family</span>` : ""}
        ${e.umbrella ? `<span class="chip">${esc(e.umbrella)}</span>` : ""}
        <span class="chip score">score ${e.score ?? 0}</span>
        <span class="chip">${e.source_count || (e.sources || []).length} source${(e.source_count || 1) === 1 ? "" : "s"}</span>
        ${e.confidence != null && e.confidence < 0.75 ? `<span class="chip">check date</span>` : ""}
      </div>
    </div>
    <div class="act">
      <button class="b keep ${d.decision === "keep" ? "on" : ""}" data-a="keep">Keep</button>
      <button class="b skip ${d.decision === "skip" ? "on" : ""}" data-a="skip">Skip</button>
      ${link ? `<button class="b" data-a="copy" data-link="${esc(link)}">Copy link</button>` : ""}
      <input type="text" id="note-${esc(e.key).replace(/[^a-z0-9]/gi, "_")}" placeholder="Note" value="${esc(d.note || "")}" data-a="note">
    </div>
  </article>`;
}
function render() {
  const rows = visible();
  if (!rows.length) { $("#list").innerHTML = `<div class="empty">Nothing here${$("#hideskip").checked ? " (skipped events are hidden)" : ""}.</div>`; return; }
  let out = "", lastDay = "";
  for (const e of rows) { const day = fmtDay(e.starts_at); if (day !== lastDay) { out += `<div class="day">${esc(day)}</div>`; lastDay = day; } out += card(e); }
  $("#list").innerHTML = out;
}
$("#list").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-a]"); if (!b) return;
  const key = b.closest(".ev").dataset.k;
  if (b.dataset.a === "copy") {
    const t = b.dataset.link;
    navigator.clipboard.writeText(t).then(() => toast("Link copied"), () => { const r = document.createElement("textarea"); r.value = t; document.body.appendChild(r); r.select(); try { document.execCommand("copy"); toast("Link copied"); } catch { toast("Select and copy: " + t); } r.remove(); });
    return;
  }
  const cur = decisions[key]?.decision;
  saveDecision(key, {decision: cur === b.dataset.a ? null : b.dataset.a});
  render();
});
$("#list").addEventListener("change", (ev) => {
  const i = ev.target.closest("input[data-a='note']"); if (!i) return;
  saveDecision(i.closest(".ev").dataset.k, {note: i.value});
});
["#q", "#fam", "#hideskip"].forEach((s) => $(s).addEventListener("input", render));
$("#export").onclick = () => {
  const t = JSON.stringify({run: META.run, exported_at: new Date().toISOString(), decisions}, null, 1);
  navigator.clipboard.writeText(t).then(() => toast("Decisions copied"), () => toast("Copy failed; use the db"));
};
$("#meta").innerHTML = [META.window && `<b>${esc(META.window)}</b>`, META.umbrella && esc(META.umbrella), `${META.counts.events} events`, `${META.counts.highlights} highlights`].filter(Boolean).join(" · ");
tabs(); render();
</script>
