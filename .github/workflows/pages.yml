name: pages
# Deploys site/ to GitHub Pages (scout.eventrrr.com) on every push to main that touches it.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp asset URLs so browsers fetch new code after each deploy
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(styles\.css|config\.js|categories\.js|app\.js)\"#\1=\"\2?v=$v\"#g" site/index.html
          grep -c "?v=$v" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
