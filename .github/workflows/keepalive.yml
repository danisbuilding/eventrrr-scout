name: keepalive
# Scout IQ lives on Supabase's free plan, which pauses a project after 7 idle days. Sweeps are on demand, so once
# a week this checks the last write and, if it is more than 5 days old, inserts a heartbeats row.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCOUT_IQ_DB_URL: "${{ secrets.SCOUT_IQ_DB_URL }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "psycopg[binary]"
      - run: python scout/iq_keepalive.py --days 5
