name: publish
# Pushes runs/<run>/events.json into Supabase so scout.eventrrr.com shows the run.
# Claude triggers it after scoring: gh workflow run publish.yml -f run=... -f window_from=... -f window_to=... -f umbrella=...
on:
  workflow_dispatch:
    inputs:
      run:         {description: "Run name", required: true}
      window_from: {description: "YYYY-MM-DD", required: false, default: ""}
      window_to:   {description: "YYYY-MM-DD", required: false, default: ""}
      umbrella:    {description: "Umbrella event name", required: false, default: ""}
      pull_decisions: {description: "Instead: pull decisions for this run into decisions/", required: false, default: "false"}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
      SUPABASE_SERVICE_KEY: "${{ secrets.SUPABASE_SERVICE_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - if: ${{ inputs.pull_decisions != 'true' }}
        run: python scout/publish.py "${{ inputs.run }}" --window-from "${{ inputs.window_from }}" --window-to "${{ inputs.window_to }}" --umbrella "${{ inputs.umbrella }}"
      - if: ${{ inputs.pull_decisions == 'true' }}
        run: |
          python scout/publish.py "${{ inputs.run }}" --pull-decisions
          git config user.name "eventrrr-scout bot"; git config user.email "bot@users.noreply.github.com"
          git add decisions/ && (git diff --cached --quiet || git commit -m "decisions: ${{ inputs.run }}") && git push
