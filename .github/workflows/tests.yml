name: tests
# Dedupe regression tests: every pair DP has marked Duplicate must merge, look-alikes must not.
on:
  push:
    paths: ["scout/normalize.py", "scout/test_normalize.py", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scout/normalize.py", "scout/test_normalize.py"]
  workflow_dispatch:

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scout/test_normalize.py
