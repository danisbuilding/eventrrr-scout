name: sweep
# Runs the network-side gathering in the cloud: Instagram (Apify) + LLM scouts (OpenAI, Gemini).
# Claude triggers it with `gh workflow run sweep.yml -f run=... -f window_from=... -f window_to=...`,
# then pulls inbox/<run>/ and does extraction, scoring and the dashboard.
on:
  workflow_dispatch:
    inputs:
      run:         {description: "Run name, e.g. 2026-10-28-dia-de-muertos", required: true}
      window_from: {description: "YYYY-MM-DD", required: true}
      window_to:   {description: "YYYY-MM-DD", required: true}
      umbrella:    {description: "Umbrella event name (optional)", required: false, default: ""}
      ig_tier:     {description: "Instagram handles: 1, 2 or all", required: false, default: "all"}
      scouts:      {description: "LLM scouts: both, openai, gemini, none", required: false, default: "both"}

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt requests pillow
      - name: Instagram via Apify
        continue-on-error: true
        env: {APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"}
        run: python scout/instagram_apify.py "${{ inputs.run }}" --tier "${{ inputs.ig_tier }}"
      - name: LLM scouts
        if: ${{ inputs.scouts != 'none' }}
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        run: |
          ONLY=""; [ "${{ inputs.scouts }}" = "openai" ] && ONLY="--only openai"; [ "${{ inputs.scouts }}" = "gemini" ] && ONLY="--only gemini"
          python scouts/run_scouts.py "${{ inputs.run }}" --window-from "${{ inputs.window_from }}" --window-to "${{ inputs.window_to }}" --umbrella "${{ inputs.umbrella }}" $ONLY
      - name: Commit inbox
        run: |
          git config user.name "eventrrr-scout bot"
          git config user.email "bot@users.noreply.github.com"
          git add inbox/
          git diff --cached --quiet || git commit -m "sweep: ${{ inputs.run }}"
          git push
