name: venues
# Backfill the Google Maps venue lookup on a run that already exists (no sweep, no extraction): venues.py then
# score.py, then commit runs/<run>/events.json and data/venues.json. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      run: {description: "Run name (runs/<run>/events.json must exist)", required: true}
      max: {description: "Max new Places lookups this run", required: false, default: "150"}

permissions:
  contents: write

concurrency: {group: pipeline, cancel-in-progress: false}

jobs:
  venues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_PLACES_API_KEY: "${{ secrets.GOOGLE_PLACES_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml requests
      - run: |
          python scout/venues.py "${{ inputs.run }}" --max "${{ inputs.max }}"
          python scout/score.py "${{ inputs.run }}"
      - run: |
          git config user.name "eventrrr-scout bot"; git config user.email "bot@users.noreply.github.com"
          git add runs/ data/
          git diff --cached --quiet || git commit -m "venues: ${{ inputs.run }}"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep $((i * 5)); done
